<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Отклик на вакансию — Метро New Работа</title>

    <!-- ===== ИКОНКИ САЙТА ===== -->
    <link rel="shortcut icon" href="https://kirill12633.github.io/Metro.New.Official/ru/images/metro-icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="https://kirill12633.github.io/Metro.New.Official/ru/images/metro-icon.png" />

    <!-- ===== ШРИФТЫ ===== -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- ===== FIREBASE ===== -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        /* ===== ПЕРЕМЕННЫЕ ===== */
        :root {
            --radius: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --bg-primary: #0d1526;
            --bg-secondary: #131c33;
            --bg-card: #182444;
            --bg-card-hover: #1d2b4f;
            --text-primary: #f2f4fa;
            --text-secondary: #a6b0cc;
            --text-tertiary: #77819e;
            --accent: #FFD700;
            --accent-hover: #ffe14d;
            --accent-light: rgba(255, 215, 0, 0.15);
            --accent-glow: rgba(255, 215, 0, 0.2);
            --green: #34a853;
            --green-light: rgba(52, 168, 83, 0.15);
            --red: #f28b82;
            --red-light: rgba(242, 139, 130, 0.15);
            --border: #253460;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.6);
            color-scheme: dark;
        }

        [data-theme="light"] {
            --bg-primary: #ffffff;
            --bg-secondary: #f4f6fb;
            --bg-card: #ffffff;
            --bg-card-hover: #eef1f9;
            --text-primary: #14151f;
            --text-secondary: #565f7a;
            --text-tertiary: #8890a8;
            --accent: #e6c200;
            --accent-hover: #c2a300;
            --accent-light: rgba(230, 194, 0, 0.12);
            --accent-glow: rgba(230, 194, 0, 0.18);
            --green: #1e8e4e;
            --green-light: rgba(30, 142, 78, 0.1);
            --red: #d93025;
            --red-light: rgba(217, 48, 37, 0.1);
            --border: #e2e6f0;
            --shadow: 0 8px 30px rgba(20, 22, 40, 0.1);
            --shadow-lg: 0 16px 40px rgba(20, 22, 40, 0.12);
            color-scheme: light;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        /* ===== HEADER ===== */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, var(--text-primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .page-header .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            border-radius: 50px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.25s;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: #0d1526;
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 35px var(--accent-glow);
        }

        .btn-green {
            background: linear-gradient(135deg, var(--green), #2d8f4e);
            color: #fff;
        }
        .btn-green:hover {
            transform: translateY(-3px);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover {
            background: var(--bg-card-hover);
            transform: translateY(-3px);
        }

        .theme-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .theme-toggle:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 0 18px var(--accent-glow);
        }

        .theme-toggle .fa-moon {
            opacity: 1;
            transform: rotate(0deg) scale(1);
        }
        .theme-toggle .fa-sun {
            opacity: 0;
            transform: rotate(90deg) scale(0.3);
        }
        [data-theme="light"] .theme-toggle .fa-sun {
            opacity: 1;
            transform: rotate(0deg) scale(1);
            color: var(--accent);
        }
        [data-theme="light"] .theme-toggle .fa-moon {
            opacity: 0;
            transform: rotate(-90deg) scale(0.3);
        }

        /* ===== LOADING ===== */
        .loading {
            text-align: center;
            padding: 30px 0;
            color: var(--text-secondary);
        }

        .loading i {
            font-size: 2rem;
            color: var(--accent);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* ===== VACANCY INFO ===== */
        .vacancy-info {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px 30px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
        }

        .vacancy-info .badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 3px 14px;
            border-radius: 50px;
            background: var(--accent-light);
            color: var(--accent);
            margin-bottom: 8px;
        }

        .vacancy-info .badge.closed {
            background: var(--text-disabled);
            color: var(--text-secondary);
        }

        .vacancy-info h2 {
            font-size: 1.5rem;
            margin-bottom: 4px;
        }

        .vacancy-info .meta {
            color: var(--text-secondary);
            font-size: 0.9rem;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }

        .vacancy-info .meta i {
            color: var(--accent);
            width: 16px;
        }

        .vacancy-info .closed-message {
            color: var(--text-tertiary);
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        /* ===== FORM ===== */
        .form-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 40px;
            box-shadow: var(--shadow);
        }

        .form-section h2 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--text-primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .form-section .subtitle {
            color: var(--text-secondary);
            margin-bottom: 24px;
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 0.95rem;
        }

        .form-group label .required {
            color: var(--red);
            margin-left: 4px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            transition: border-color 0.25s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-actions {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .page-header {
                flex-direction: column;
                align-items: stretch;
            }
            .page-header .header-actions {
                justify-content: flex-start;
            }
            .form-section {
                padding: 24px;
            }
            .vacancy-info {
                padding: 18px 20px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .form-section {
                padding: 18px;
            }
            .form-actions {
                flex-direction: column;
            }
            .form-actions .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== HEADER ===== -->
        <header class="page-header">
            <h1><i class="fas fa-paper-plane" style="color:var(--accent);"></i> Отклик на вакансию</h1>
            <div class="header-actions">
                <a href="https://kirill12633.github.io/careers.metro.new/vacancies" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> Назад к вакансиям
                </a>
                <button class="theme-toggle" id="themeToggle" title="Сменить тему">
                    <i class="fas fa-moon"></i>
                    <i class="fas fa-sun"></i>
                </button>
            </div>
        </header>

        <!-- ===== VACANCY INFO ===== -->
        <div class="vacancy-info" id="vacancyInfo">
            <div class="loading" id="infoLoading">
                <i class="fas fa-spinner"></i>
                <p>Загрузка информации о вакансии...</p>
            </div>
            <div id="infoContent" style="display:none;">
                <span class="badge" id="vBadge">Открыта</span>
                <h2 id="vTitle">Название вакансии</h2>
                <div class="meta">
                    <span><i class="fas fa-map-pin"></i> <span id="vLocation">—</span></span>
                    <span><i class="fas fa-clock"></i> <span id="vSchedule">—</span></span>
                </div>
                <div class="closed-message" id="closedMessage" style="display:none;">
                    <i class="fas fa-clock" style="color:var(--accent);"></i>
                    Эта вакансия ещё не открыта для откликов. Следите за обновлениями!
                </div>
            </div>
        </div>

        <!-- ===== FORM ===== -->
        <section class="form-section" id="formSection">
            <h2>Анкета соискателя</h2>
            <p class="subtitle">Заполните форму и нажмите «Отправить» — письмо откроется в вашем почтовом клиенте</p>

            <form id="applicationForm">
                <input type="hidden" id="vacancyTitleInput" value="" />

                <div class="form-row">
                    <div class="form-group">
                        <label for="fullName">Имя <span class="required">*</span></label>
                        <input type="text" id="fullName" placeholder="Иван" required />
                    </div>
                    <div class="form-group">
                        <label for="email">Email <span class="required">*</span></label>
                        <input type="email" id="email" placeholder="ivan@example.com" required />
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="age">Возраст <span class="required">*</span></label>
                        <input type="number" id="age" placeholder="18" min="14" max="99" required />
                    </div>
                    <div class="form-group">
                        <label for="experience">Опыт работы <span class="required">*</span></label>
                        <textarea id="experience" placeholder="Расскажите о вашем опыте работы, проектах и навыках..." required></textarea>
                    </div>
                </div>

                <div class="form-group">
                    <label for="motivation">Почему вы хотите работать у нас? <span class="required">*</span></label>
                    <textarea id="motivation" placeholder="Почему вы выбрали именно нашу компанию?" required></textarea>
                </div>

                <div class="form-group">
                    <label for="portfolio">Ссылка на портфолио или GitHub (если есть)</label>
                    <input type="url" id="portfolio" placeholder="https://github.com/your-username" />
                </div>

                <div class="form-group">
                    <label for="additionalInfo">Дополнительная информация</label>
                    <textarea id="additionalInfo" placeholder="Всё, что вы хотите добавить к своей заявке..." rows="3"></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-green" id="submitBtn">
                        <i class="fas fa-paper-plane"></i> Отправить заявку
                    </button>
                    <button type="reset" class="btn btn-secondary">
                        <i class="fas fa-undo"></i> Очистить форму
                    </button>
                </div>
            </form>
        </section>

    </div>

    <!-- ============================================================ -->
    <!-- ===== FIREBASE + MAIN SCRIPTS ===== -->
    <!-- ============================================================ -->
    <script>
        // ===== FIREBASE CONFIG =====
        const firebaseConfig = {
            apiKey: "AIzaSyAVSAXTU1VqF36GJA1pQOfxRxo3_ixW7F4",
            authDomain: "metro-new-admin.firebaseapp.com",
            projectId: "metro-new-admin",
            storageBucket: "metro-new-admin.firebasestorage.app",
            messagingSenderId: "769002010414",
            appId: "1:769002010414:web:bdeb93a7eddc4cab63ecbf"
        };

        // ===== ИНИЦИАЛИЗАЦИЯ FIREBASE =====
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ===== DOM ЭЛЕМЕНТЫ =====
        const infoLoading = document.getElementById('infoLoading');
        const infoContent = document.getElementById('infoContent');
        const vBadge = document.getElementById('vBadge');
        const vTitle = document.getElementById('vTitle');
        const vLocation = document.getElementById('vLocation');
        const vSchedule = document.getElementById('vSchedule');
        const closedMessage = document.getElementById('closedMessage');
        const formSection = document.getElementById('formSection');

        const vacancyTitleInput = document.getElementById('vacancyTitleInput');
        const fullNameInput = document.getElementById('fullName');
        const emailInput = document.getElementById('email');
        const ageInput = document.getElementById('age');
        const experienceInput = document.getElementById('experience');
        const motivationInput = document.getElementById('motivation');
        const portfolioInput = document.getElementById('portfolio');
        const additionalInfoInput = document.getElementById('additionalInfo');

        const form = document.getElementById('applicationForm');

        let vacancyTitle = '';

        // ===== ПОЛУЧЕНИЕ ID ВАКАНСИИ ИЗ URL =====
        function getVacancyIdFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        // ===== ЗАГРУЗКА ИНФОРМАЦИИ О ВАКАНСИИ =====
        async function loadVacancyInfo() {
            const id = getVacancyIdFromUrl();

            if (!id) {
                infoLoading.innerHTML = '<p style="color:var(--red);">❌ Не указана вакансия</p>';
                formSection.style.display = 'none';
                return;
            }

            try {
                const doc = await db.collection('careers').doc(id).get();

                if (!doc.exists) {
                    infoLoading.innerHTML = '<p style="color:var(--red);">❌ Вакансия не найдена</p>';
                    formSection.style.display = 'none';
                    return;
                }

                const data = doc.data();
                vacancyTitle = data.title || 'Без названия';

                // Если вакансия "Скоро" — скрываем форму
                if (data.status === 'soon') {
                    vBadge.textContent = 'Скоро';
                    vBadge.className = 'badge closed';
                    vTitle.textContent = vacancyTitle;
                    vLocation.textContent = data.location || '—';
                    vSchedule.textContent = data.schedule || '—';
                    closedMessage.style.display = 'block';
                    formSection.style.display = 'none';

                    infoLoading.style.display = 'none';
                    infoContent.style.display = 'block';
                    return;
                }

                // Заполняем информацию для открытой вакансии
                vBadge.textContent = 'Открыта';
                vBadge.className = 'badge';
                vTitle.textContent = vacancyTitle;
                vLocation.textContent = data.location || '—';
                vSchedule.textContent = data.schedule || '—';

                vacancyTitleInput.value = vacancyTitle;

                infoLoading.style.display = 'none';
                infoContent.style.display = 'block';

            } catch (error) {
                console.error('Ошибка загрузки:', error);
                infoLoading.innerHTML = '<p style="color:var(--red);">❌ Ошибка загрузки вакансии</p>';
                formSection.style.display = 'none';
            }
        }

        // ===== ОТПРАВКА ЧЕРЕЗ MAILTO =====
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            // Сбор данных
            const name = fullNameInput.value.trim();
            const email = emailInput.value.trim();
            const age = ageInput.value.trim();
            const experience = experienceInput.value.trim();
            const motivation = motivationInput.value.trim();
            const portfolio = portfolioInput.value.trim() || 'Не указано';
            const additional = additionalInfoInput.value.trim() || 'Не указано';

            // Валидация
            if (!name || !email || !age || !experience || !motivation) {
                alert('⚠️ Заполните все обязательные поля!');
                return;
            }

            if (!email.includes('@')) {
                alert('⚠️ Введите корректный email!');
                return;
            }

            if (parseInt(age) < 14 || parseInt(age) > 99) {
                alert('⚠️ Возраст должен быть от 14 до 99 лет!');
                return;
            }

            // Формируем тело письма
            const body = `
    Новая заявка на вакансию

    ─── Данные соискателя ───

    Вакансия: ${vacancyTitle}
    Имя: ${name}
    Email: ${email}
    Возраст: ${age}

    Опыт работы:
    ${experience}

    Мотивация:
    ${motivation}

    Портфолио: ${portfolio}

    Дополнительная информация:
    ${additional}
            `;

            // Кодируем для URL
            const subjectEncoded = encodeURIComponent(`Заявка на вакансию ${vacancyTitle}`);
            const bodyEncoded = encodeURIComponent(body);

            // Открываем почтовый клиент
            window.location.href = `mailto:metro.new.help@gmail.com?subject=${subjectEncoded}&body=${bodyEncoded}`;

            // Показываем сообщение
            alert('✅ Письмо открыто! Проверьте и отправьте.');

            // Очищаем форму
            form.reset();
        });

        // ===== ТЕМА =====
        const THEME_KEY = 'metro_new_theme';
        const root = document.documentElement;

        function applyTheme(theme) {
            root.setAttribute('data-theme', theme);
        }

        function getInitialTheme() {
            const saved = localStorage.getItem(THEME_KEY);
            if (saved === 'light' || saved === 'dark') return saved;
            return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }

        let currentTheme = getInitialTheme();
        applyTheme(currentTheme);

        document.getElementById('themeToggle').addEventListener('click', () => {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            applyTheme(currentTheme);
            localStorage.setItem(THEME_KEY, currentTheme);
        });

        // ===== ЗАПУСК =====
        document.addEventListener('DOMContentLoaded', function() {
            loadVacancyInfo();
        });
    </script>

</body>
</html>
