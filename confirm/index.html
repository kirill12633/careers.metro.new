<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Подтверждение согласия — Метро New</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --bg: #0d1526;
            --card: #182444;
            --text: #f2f4fa;
            --text-secondary: #a6b0cc;
            --accent: #FFD700;
            --green: #34a853;
            --red: #f28b82;
            --border: #253460;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 50px 40px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            box-shadow: 0 16px 40px rgba(0,0,0,0.6);
        }
        .icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin-bottom: 16px;
        }
        .icon.loading { background: rgba(255,215,0,0.12); color: var(--accent); }
        .icon.success { background: rgba(52,168,83,0.15); color: var(--green); }
        .icon.error { background: rgba(242,139,130,0.15); color: var(--red); }
        .icon.loading i { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        h1 { font-size: 1.5rem; margin-bottom: 10px; }
        p { color: var(--text-secondary); font-size: 0.95rem; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon loading" id="icon"><i class="fas fa-spinner"></i></div>
        <h1 id="title">Проверяем ссылку…</h1>
        <p id="text">Пожалуйста, подождите.</p>
    </div>

    <script>
        // ===== ЗАМЕНИТЕ на URL вашего задеплоенного Cloudflare Worker =====
        const WORKER_URL = 'metro-new-applications.kirilltyr123.workers.dev';

        const icon = document.getElementById('icon');
        const title = document.getElementById('title');
        const text = document.getElementById('text');

        async function confirm() {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');

            if (!token) {
                showError('Ссылка некорректна', 'В ссылке отсутствует код подтверждения. Проверьте, что вы скопировали её полностью из письма.');
                return;
            }

            try {
                const res = await fetch(`${WORKER_URL}/api/confirm?token=${encodeURIComponent(token)}`);
                const result = await res.json();

                if (!res.ok || !result.ok) {
                    showError('Не удалось подтвердить', result.error === 'invalid_or_expired_token'
                        ? 'Эта ссылка уже использована или срок её действия истёк (48 часов). Попросите ребёнка подать заявку заново.'
                        : 'Что-то пошло не так. Попробуйте позже или свяжитесь с нами.');
                    return;
                }

                icon.className = 'icon success';
                icon.innerHTML = '<i class="fas fa-check-circle"></i>';
                title.textContent = 'Согласие подтверждено!';
                text.textContent = 'Спасибо! Заявка вашего ребёнка передана на рассмотрение.';
            } catch (err) {
                showError('Ошибка сети', 'Проверьте подключение к интернету и попробуйте перейти по ссылке снова.');
            }
        }

        function showError(t, msg) {
            icon.className = 'icon error';
            icon.innerHTML = '<i class="fas fa-triangle-exclamation"></i>';
            title.textContent = t;
            text.textContent = msg;
        }

        confirm();
    </script>
</body>
</html>
